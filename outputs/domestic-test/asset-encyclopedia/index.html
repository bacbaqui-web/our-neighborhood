<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>에셋 백과 · 우리동네</title><link rel="stylesheet" href="style.css?v=asset-authority1"><script type="importmap">{"imports":{"three":"../vendor/three.module.js"}}</script></head><body>
<header><h1>에셋 백과</h1></header>
<main><form id="filters" role="search"><label class="search">검색<input id="search" type="search" placeholder="에셋 이름 검색"></label></form>
<div id="tabs" role="tablist" aria-label="에셋 종류">
<button type="button" role="tab" id="tab-building" data-group="building" aria-selected="true" tabindex="0">건물</button>
<button type="button" role="tab" id="tab-tree" data-group="tree" aria-selected="false" tabindex="-1">나무</button>
<button type="button" role="tab" id="tab-car" data-group="car" aria-selected="false" tabindex="-1">자동차</button>
<button type="button" role="tab" id="tab-prop" data-group="prop" aria-selected="false" tabindex="-1">소품</button>
<button type="button" role="tab" id="tab-person" data-group="person" aria-selected="false" tabindex="-1">사람</button>
</div><label id="treeUseFilter" hidden for="treeUse">나무 용도<select id="treeUse"><option value="">전체</option><option value="street">가로수</option><option value="yard">마당</option></select></label><p id="reviewError" role="alert"></p><section id="panel" role="tabpanel" aria-labelledby="tab-building"><p id="status" role="status"></p><div id="grid" class="grid"></div><p id="empty" hidden>검색 결과가 없습니다.</p></section><p id="error" role="alert"></p></main>
<dialog id="detail" aria-labelledby="title"><div class="detail-head"><div><small id="collectionName"></small><h2 id="title"></h2></div><button id="close">닫기</button></div><fieldset id="treeOptions" hidden><legend>나무 미리보기</legend><label for="treeSeason">계절</label><select id="treeSeason"><option value="spring">봄</option><option value="summer" selected>여름</option><option value="autumn">가을</option><option value="winter">겨울</option></select><label for="treeHeight">높이 <output id="treeHeightValue" for="treeHeight">10.5m</output></label><input id="treeHeight" type="range" min="3" max="30" step="0.5" value="10.5"><small>미리보기에만 적용됩니다.</small></fieldset><fieldset id="personOptions" hidden><legend>계절별 옷</legend><input type="radio" name="personSeason" id="person-spring" value="spring" checked><label for="person-spring">봄</label><input type="radio" name="personSeason" id="person-summer" value="summer"><label for="person-summer">여름</label><input type="radio" name="personSeason" id="person-autumn" value="autumn"><label for="person-autumn">가을</label><input type="radio" name="personSeason" id="person-winter" value="winter"><label for="person-winter">겨울</label><label for="personPitch">시점</label><select id="personPitch"><option value="0">눈높이</option><option value="30">위에서 30°</option><option value="60">위에서 60°</option></select></fieldset><div id="viewerArea"><div id="stage"></div><details id="lineOptions" open></details></div><div id="personRotate" class="actions" hidden><button id="personLeft" type="button">왼쪽으로 돌리기</button><button id="personRight" type="button">오른쪽으로 돌리기</button></div><div id="detailReview" class="detail-review"></div><p id="detailError" role="alert"></p><p id="meta"></p><p id="note"></p><div class="actions"><button id="reset">시점 초기화</button><a id="file" download>원본 파일 받기</a><a id="treeSource" target="_blank" rel="noopener" hidden>높이 자료 보기</a><a id="related" target="_blank" rel="noopener">기존 도감 열기</a></div><p id="previewHint" class="hint">드래그: 회전 · 휠: 확대. 미리보기 크기는 화면에 맞췄습니다.</p></dialog><script type="module" src="app.js?v=asset-authority1"></script></body></html>
