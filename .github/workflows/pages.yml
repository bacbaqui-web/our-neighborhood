name: Publish neighborhood
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image build dependency
        run: python -m pip install Pillow
      - name: Check loading behavior
        run: |
          node scripts/check-loading.mjs
          node tests/browser-generation.mjs
          node tests/vworld-browser.mjs
          node tests/visible-horizon.mjs
          node tests/visible-horizon-worker.mjs
          node --experimental-loader ./tests/three-loader.mjs tests/street-end-context.mjs
      - name: Check scene budget
        run: |
          node --experimental-loader ./tests/three-loader.mjs tests/scene-budget.mjs
          node --experimental-loader ./tests/three-loader.mjs tests/circular-background.mjs
          node --experimental-loader ./tests/three-loader.mjs tests/full-detail.mjs
          node --experimental-loader ./tests/three-loader.mjs tests/shop-interiors.mjs
          node --experimental-loader ./tests/three-loader.mjs tests/shop-expansion.mjs
          node --experimental-loader ./tests/three-loader.mjs tests/sungshin-commercial.mjs
          node --experimental-loader ./tests/three-loader.mjs tests/sungshin-commercial-interiors.mjs
          node --experimental-loader ./tests/three-loader.mjs tests/sungshin-lettering.mjs
          node --experimental-loader ./tests/three-loader.mjs tests/sungshin-placement.mjs
          node --experimental-loader ./tests/three-loader.mjs tests/shop-publication.mjs
          python3 -m unittest discover -s tests -p test_generation_scope.py
      - uses: actions/configure-pages@v5
      - name: Build reviewed public assets
        env:
          VWORLD_WEB_KEY: ${{ secrets.VWORLD_WEB_KEY }}
        run: python3 scripts/build-site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: github-pages-${{ github.run_attempt }}
      - name: Wait for uploaded Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_REPOSITORY: ${{ github.repository }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
          DEPLOY_ARTIFACT: github-pages-${{ github.run_attempt }}
        run: |
          for attempt in $(seq 1 12); do
            count=$(gh api "repos/$DEPLOY_REPOSITORY/actions/runs/$DEPLOY_RUN_ID/artifacts" --jq "[.artifacts[] | select(.name == \"$DEPLOY_ARTIFACT\" and .expired == false)] | length")
            if [ "$count" -eq 1 ]; then exit 0; fi
            sleep 5
          done
          echo "Pages artifact is not yet visible to the deployment API."
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
