<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>지도 정돈 · 로컬 시험</title><style>body{font:16px system-ui;background:#eef2ed;color:#29403c;margin:36px}button{font:inherit;padding:12px;border-radius:8px;border:1px solid #a4b7a8;background:white}p{max-width:620px}</style><h1>지도 정돈 · 로컬 시험</h1><p>정릉동 주변 지도를 불러옵니다. 도로를 확정한 뒤 건물 용도·입구·위치를 조정합니다.</p><button id="open">지도 정돈 열기</button><p id="status" role="status"></p><script type="module">
import {configureRoads} from './road-setup.js';
import {generateInBrowser} from './client.js';
const point={address:'정릉동 로컬 정돈 시험',center:[37.625513523469,127.026651155374],radius:100};
document.querySelector('#open').onclick=async()=>{try{const result=await configureRoads(point);window.preparedMap=result;const pre=document.createElement('pre');pre.id='prepared-result';pre.textContent=JSON.stringify({roads:result.sceneEdits.roads,roadGroups:result.sceneEdits.roadGroups,buildings:result.sceneEdits.buildings},null,2);document.body.append(pre);document.querySelector('#status').textContent='지도 정돈을 마쳤습니다. 3D 생성은 아래 버튼으로 시작합니다.';const button=document.createElement('button');button.textContent='정돈한 지도로 3D 생성';button.onclick=async()=>{button.disabled=true;try{const scene=await generateInBrowser(result,text=>document.querySelector('#status').textContent=text);window.generatedScene=scene;const report=document.createElement('pre');report.id='generated-result';report.textContent=JSON.stringify({id:scene.id,buildings:scene.buildings,roadPriority:scene.roadPriority},null,2);document.body.append(report);document.querySelector('#status').textContent='생성·저장 완료';const a=document.createElement('a');a.textContent='만든 동네 열기';a.href='../?location='+scene.id+'&radius=100';document.body.append(a);}catch(e){document.querySelector('#status').textContent=e.message;button.disabled=false;}};document.body.append(button);}catch(e){document.querySelector('#status').textContent=e.name==='AbortError'?'취소했습니다.':e.message;}};
</script></html>
