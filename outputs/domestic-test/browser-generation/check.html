<!doctype html><html lang="ko"><meta charset="utf-8"><title>브라우저 동네 생성 확인</title><h1>브라우저 동네 생성 확인</h1><button id="start">100m 큰길 생성 검사</button><button id="render" disabled>만든 동네 열기</button><pre id="result">대기 중</pre><script type="module">
import {saveScene} from './storage.js';
start.onclick=()=>{start.disabled=true;result.textContent='대기 중';const begin=performance.now(),worker=new Worker('./worker.js',{type:'module'});worker.onmessage=async({data})=>{if(data.type==='progress')result.textContent+=`\n${data.percent}% ${data.message}`;else if(data.type==='complete'){await saveScene(data.manifest,data.files);result.textContent+='\n완료 '+JSON.stringify({seconds:(performance.now()-begin)/1000,manifest:data.manifest,files:Object.keys(data.files)});render.disabled=false;render.onclick=()=>location.href='../?location='+data.manifest.id;worker.terminate();}else{result.textContent+='\n실패 '+data.message;worker.terminate();start.disabled=false;}};worker.onerror=e=>{result.textContent+='\n'+e.message;start.disabled=false;};worker.postMessage({address:'서울 강북구 도봉로 188-1',center:[37.625513523469,127.026651155374],radius:100,places:[]});};
</script></html>
