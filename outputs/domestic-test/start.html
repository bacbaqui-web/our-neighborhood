<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리동네 · 웹툰 배경 만들기</title><link rel="stylesheet" href="./ui.css?v=142"><style>
body{margin:0;display:block;overflow:auto;background:#edf3f1;color:#243d42;font-family:system-ui,sans-serif}.start-card{box-sizing:border-box;max-width:720px;margin:8vh auto;padding:40px;background:white;border:1px solid #d9e3e0;border-radius:24px;box-shadow:0 20px 70px #153b3410}.start-card h1{font-size:32px;margin:0 0 12px}.start-card p{line-height:1.8;color:#526969}.start-form{display:flex;gap:8px;margin:28px 0 12px}.start-form input{min-width:0;flex:1;padding:14px;border:1px solid #bccfca;border-radius:10px;font-size:16px}.start-card button,.start-card a{cursor:pointer;border-radius:10px;padding:13px 16px;background:#246957;color:white;border:0;text-decoration:none;font-size:15px}.start-card label{display:flex;align-items:center;gap:10px}.start-card label input{width:80px;padding:9px;border:1px solid #bccfca;border-radius:8px}.start-card h2{font-size:19px;margin-top:36px}.saved-list{display:grid;gap:9px;margin:16px 0 28px}.saved-list a{background:#eef5f2;color:#245443}.start-card .example{background:none;padding:0;color:#366a5c;text-decoration:underline}.start-note{font-size:13px}.start-status{white-space:pre-wrap}@media(max-width:760px){.start-card{margin:18px;padding:24px}.start-form{flex-wrap:wrap}.start-form button{width:100%}}
</style></head><body><main class="start-card"><h1>우리동네</h1><p>지도에서 위치를 고르면 그 주변을 웹툰 배경으로 만듭니다.<br>설치 없이 이 브라우저에서 바로 사용할 수 있습니다.</p><form class="start-form"><input id="query" aria-label="주소 또는 장소" placeholder="주소나 장소 이름을 입력하세요"><button>지도에서 위치 선택</button></form><label>생성 반경 <input id="radius" type="number" min="50" max="300" step="50" value="100"> m</label><p class="start-status" role="status"></p><h2>이 브라우저에 저장된 동네</h2><div class="saved-list"></div><p class="start-note">만든 동네는 이 기기에 저장됩니다. 브라우저 데이터를 지우면 함께 지워집니다. 처음 실행할 때는 필요한 파일을 내려받습니다. 건물 외관과 도로 높이는 지도 자료를 바탕으로 추정하므로 실제 모습과 다를 수 있습니다.</p><a class="example" href="./?location=original&radius=50">예제 동네 먼저 둘러보기</a></main><script type="module">
import {chooseMapPoint} from './map-picker.js?v=142';
import {createNeighborhood} from './browser-generation/progress.js';
import {listScenes} from './browser-generation/storage.js';
const form=document.querySelector('form'),message=document.querySelector('[role=status]'),saved=document.querySelector('.saved-list');
listScenes().then(rows=>{if(!rows.length)saved.textContent='아직 만든 동네가 없습니다.';for(const row of rows.reverse()){const a=document.createElement('a');a.textContent=row.address+' · 반경 '+row.sizeMetres/2+'m';a.href='./?location='+row.id+'&radius='+row.sizeMetres/2;saved.append(a);}}).catch(()=>{saved.textContent='브라우저 저장 공간을 사용할 수 없습니다.';});
form.onsubmit=async event=>{event.preventDefault();const button=form.querySelector('button');button.disabled=true;message.textContent='';try{const point=await chooseMapPoint({query:document.querySelector('#query').value,origin:[37.625513523469,127.026651155374],radius:Number(document.querySelector('#radius').value)});if(!point)return;const result=await createNeighborhood(point);location.href='./?location='+result.id+'&radius='+point.radius;}catch(error){message.textContent=error.name==='AbortError'?'동네 만들기를 취소했습니다.':'동네를 만들지 못했습니다. '+error.message;}finally{button.disabled=false;}};
</script></body></html>
