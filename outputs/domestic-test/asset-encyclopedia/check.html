<!doctype html><html lang="ko"><meta charset="utf-8"><title>에셋 백과 연결 검사</title><script type="importmap">{"imports":{"three":"../vendor/three.module.js"}}</script><button id="run">전체 에셋 검사</button><pre id="result">검사 대기</pre><script type="module">
import * as T from 'three';import {createModel,release} from './models.js?v=archive3';
document.querySelector('#run').onclick=async()=>{const button=document.querySelector('#run'),out=document.querySelector('#result');button.disabled=true;const data=await(await fetch('./catalog.json')).json(),errors=[];let checked=0;for(const a of data.entries){let m;try{if(a.kind==='image'){const img=new Image();img.src=a.file;await img.decode();}else{m=await createModel(a);m.updateMatrixWorld(true);m.traverse(o=>{for(const attr of ['position','normal']){const p=o.geometry?.attributes[attr];if(p&&!p.array.every(Number.isFinite))throw Error('Non-finite '+attr);}if(!o.matrixWorld.elements.every(Number.isFinite))throw Error('Non-finite matrix');});if(new T.Box3().setFromObject(m).isEmpty())throw Error('Empty model');}}catch(e){errors.push({id:a.id,message:e.message});}finally{if(m)release(m);}checked++;out.textContent=JSON.stringify({checked,total:data.entries.length,errors},null,2);if(checked%20===0)await new Promise(r=>requestAnimationFrame(r));}out.dataset.done='true';button.disabled=false;};
</script></html>
