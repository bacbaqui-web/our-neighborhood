<!doctype html><html lang="ko"><meta charset="utf-8"><title>원본과 건물 재제작 대조</title><script type="importmap">{"imports":{"three":"../../outputs/domestic-test/vendor/three.module.js"}}</script><style>body{font:16px system-ui;background:#e5eae2;margin:12px}button{padding:10px;margin:3px}main{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}figure{margin:0;border-bottom:1px solid #bbb}img{width:100%;height:260px;object-fit:contain}figcaption{text-align:center}h2{margin:10px;font-size:18px}</style>
<button id="civic">상가·아파트·경찰서</button><button id="retail">대형 매장</button><button id="shops">편의점·카페</button><button id="back">뒷면</button><button id="night">밤</button><p id="state">준비 중</p><main></main>
<script type="module">
import * as T from 'three';import {previewBuilding} from '../../outputs/domestic-test/facilities/preview.js?v=replacements3';import {previewModel} from '../../outputs/domestic-test/building-assets/model.js?v=replacements3';import {assetById} from '../../outputs/domestic-test/building-assets/catalog.js';import {prepareBuildingIdentity} from '../../outputs/domestic-test/building-remakes/identity.js?v=replacements3';import {createIllustrationRenderer} from '../../outputs/domestic-test/illustration-renderer.js';import {CATALOG_LINES} from '../../outputs/domestic-test/asset-encyclopedia/line-options.js';
const refs=(await(await fetch('../../outputs/domestic-test/asset-encyclopedia/building-references.json')).json()).items;
await prepareBuildingIdentity();const ids=[['facility:police','facility:fire','building:school','building:civic'],['building:shop-glass','facility:lotte','facility:post','facility:daiso'],['facility:cu','facility:mega']];
let section=0,back=false,night=false;const r=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(700,440);r.setPixelRatio(1);const scene=new T.Scene(),hemi=new T.HemisphereLight(0xffffff,0x8b9b86,2.4),sun=new T.DirectionalLight(0xffffff,2.4);sun.position.set(-5,12,10);scene.add(hemi,sun);const camera=new T.PerspectiveCamera(36,700/440,.01,10000);
function show(){document.querySelector('main').replaceChildren();scene.background=new T.Color(night?'#29343c':'#e5eae2');hemi.intensity=night?.55:2.4;sun.intensity=night?.3:2.4;
for(const id of ids[section]){const[k,v]=id.split(':'),m=k==='building'?previewModel(assetById[v]):previewBuilding(v,{neighbors:false});scene.add(m);m.updateMatrixWorld(true);const box=new T.Box3().setFromObject(m),s=box.getSize(new T.Vector3()),c=box.getCenter(new T.Vector3()),d=Math.max(s.y,s.x/camera.aspect,s.z*.6)*2.1;camera.position.copy(c).add(new T.Vector3(back?-.4:.35,.23,back?-1:1).normalize().multiplyScalar(d));camera.lookAt(c);m.traverse(o=>{const mat=o.material;if(mat?.userData.nightWindowBand!==undefined||o.userData.brandSign){mat.emissive.set('#ffd18b');mat.emissiveIntensity=night?.45:0;if(o.userData.brandSign)mat.emissiveMap=mat.map;}});const ink=createIllustrationRenderer(r);ink.render(scene,camera,()=>r.render(scene,camera),CATALOG_LINES);for(const [src,title]of [[refs[id].imageUrl,id+' · 참고 원본'],[r.domElement.toDataURL(),id+' · 재제작']]){const fig=document.createElement('figure'),img=new Image();img.src=src;img.referrerPolicy='no-referrer';img.alt=title;const caption=document.createElement('figcaption');caption.textContent=title;fig.append(img,caption);document.querySelector('main').append(fig);}scene.remove(m);ink.dispose();m.traverse(o=>{o.geometry?.dispose();o.material?.dispose();});}
document.querySelector('#state').textContent='원본·결과 대조 · '+(night?'밤':back?'뒷면':'정면');}
for(const [i,id]of ['civic','retail','shops'].entries())document.querySelector('#'+id).onclick=()=>{section=i;back=false;night=false;show();};document.querySelector('#back').onclick=()=>{back=!back;show();};document.querySelector('#night').onclick=()=>{night=!night;show();};show();
</script></html>
