<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>우리동네 웹툰배경</title>
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
  <link rel="stylesheet" href="./ui.css?v=compact1">
</head>
<body>
<header>
  <div class="neighborhood">
    <h1>우리동네 웹툰배경</h1>
    <form id="addressForm" role="search">
      <input id="address" name="address" type="search" enterkeyhint="search" spellcheck="false" aria-label="생성할 동네 주소" placeholder="주소나 장소 검색 후 지도에서 선택" value="솔매로17가길 7" list="addresses" autocomplete="off" disabled>
      <datalist id="addresses"></datalist>
      <button id="findAddress" type="submit" class="icon-button" aria-label="지도에서 위치 선택" title="카카오지도에서 생성할 위치 선택" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button>
      <a href="./start.html?selectPoint=1" id="closeScene" class="icon-button" aria-label="장면 닫고 지도 선택" title="장면 닫고 지도 선택"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></a>
    </form>
  </div>
  <div class="header-actions">
    <button id="editRoads" disabled>도로 수정</button>
    <a href="./asset-encyclopedia/" class="header-link" target="_blank" rel="noopener">에셋 백과</a>
    <button id="image" title="현재 화면을 2400px PNG로 저장" disabled>PNG 저장</button>
    <button id="settings" class="icon-button" aria-label="렌더링 최적화 설정" title="렌더링 최적화 설정" aria-haspopup="dialog" aria-controls="optimizationDialog" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 3-.6 2.3-2 .9-2.1-.7-2.4 4.1 1.6 1.7v2.3l-1.6 1.7 2.4 4.1 2.1-.7 2 .9.6 2.4h5l.6-2.4 2-.9 2.1.7 2.4-4.1-1.6-1.7v-2.3l1.6-1.7-2.4-4.1-2.1.7-2-.9-.6-2.3z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </div>
</header>
<div class="layout">
  <main id="view" aria-label="동네 3D 장면" data-ready="false">
    <div id="environmentHeading">방향 확인 중</div>
    <button id="walk" class="icon-button canvas-walk" aria-label="출발 위치 선택" title="위에서 출발 위치 고르기" aria-pressed="false" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="13" cy="4" r="2"/><path d="m7 12 3-4 4 1 2 4 4 1M11 9l-1 6-4 6m4-6 5 2 1 5"/></svg></button>
      <fieldset id="environmentControls" disabled><legend class="visually-hidden">하늘과 조명</legend>
        <h2>하늘 · 시간 · 골목 조명</h2>
        <div class="environment-row">
          <select id="season" aria-label="계절" title="나무와 사람 옷의 계절"><option value="spring">봄</option><option value="summer" selected>여름</option><option value="autumn">가을</option><option value="winter">겨울</option></select>
          <select id="weather" aria-label="날씨"><option value="clear">맑음</option><option value="cloudy">흐림</option><option value="rain">비</option><option value="snow">눈</option></select>
          <select id="timeOfDay" aria-label="시간" title="한국 표준시 · 한 시간 단위"><option value="0">00:00</option><option value="1">01:00</option><option value="2">02:00</option><option value="3">03:00</option><option value="4">04:00</option><option value="5">05:00</option><option value="6">06:00</option><option value="7">07:00</option><option value="8">08:00</option><option value="9">09:00</option><option value="10">10:00</option><option value="11">11:00</option><option value="12" selected>12:00</option><option value="13">13:00</option><option value="14">14:00</option><option value="15">15:00</option><option value="16">16:00</option><option value="17">17:00</option><option value="18">18:00</option><option value="19">19:00</option><option value="20">20:00</option><option value="21">21:00</option><option value="22">22:00</option><option value="23">23:00</option></select>
        </div>
        <div class="window-row">
          <div class="window-label"><label for="windowPercent">켜진 창문</label><button id="windowMode" type="button" class="auto-mode" aria-label="창문 자동 조절" aria-pressed="true" title="시간에 맞춰 자동 조절 중 · 비율을 직접 바꾸면 수동으로 전환">자동</button></div>
          <div class="number-field"><input id="windowPercent" aria-label="켜진 창문 비율" type="number" min="0" max="100" value="0" step="1" title="직접 입력 · 휠 또는 누른 채 좌우/상하 드래그로 조절"><span aria-hidden="true">%</span></div>
          <button id="newWindowPattern">창문 조합 바꾸기</button>
        </div>
      </fieldset>
    <div id="status" role="status">동네를 불러오는 중…</div>
  </main>
  <aside aria-label="장면 설정">
    <fieldset id="sceneControls" disabled>
      <section>
        <h2>그림 표현</h2>
        <details class="art-panel" id="linePanel" open>
          <summary>선 <span>외부선 · 내부선</span></summary>
          <div class="art-toolbar"><label class="check-row"><input id="art-lines" type="checkbox" checked> 선 표시</label><button id="resetLines" class="small-reset" title="선 설정 초기화" aria-label="선 설정 초기화">↺</button></div>
<div class="line-subsection"><h3>외부선</h3><label class="art-row" for="art-outerWidth"><span>외부선 두께</span><input id="range-outerWidth" type="range" aria-label="외부선 두께 슬라이더" min="0" max="6" value="2" step=".1"><span class="number-field"><input id="art-outerWidth" type="number" aria-label="외부선 두께" min="0" max="6" value="2" step=".1" title="직접 입력 · 휠 또는 드래그로 조절"><span>px</span></span></label>
<label class="check-row"><input id="art-outerFace" type="checkbox" checked> 외부선에 면색 적용</label><label class="art-row" for="art-outerBrightness"><span>외부선 명도</span><input id="range-outerBrightness" type="range" aria-label="외부선 명도 슬라이더" min="0" max="200" value="50" step="1"><span class="number-field"><input id="art-outerBrightness" type="number" aria-label="외부선 명도" min="0" max="200" value="50" step="1" title="직접 입력 · 휠 또는 드래그로 조절"><span>%</span></span></label>
<label class="art-row" for="art-outerSaturation"><span>외부선 채도</span><input id="range-outerSaturation" type="range" aria-label="외부선 채도 슬라이더" min="0" max="200" value="110" step="1"><span class="number-field"><input id="art-outerSaturation" type="number" aria-label="외부선 채도" min="0" max="200" value="110" step="1" title="직접 입력 · 휠 또는 드래그로 조절"><span>%</span></span></label>
<label class="art-row" for="art-minDistance"><span>최소 거리</span><input id="range-minDistance" type="range" aria-label="최소 거리 슬라이더" min="0" max="200" value="1" step="1"><span class="number-field"><input id="art-minDistance" type="number" aria-label="최소 거리" min="0" max="200" value="1" step="1" title="직접 입력 · 휠 또는 드래그로 조절"><span>cm</span></span></label>
<label class="check-row"><input id="art-acrossObjects" type="checkbox" checked> 다른 오브젝트 사이에도 적용</label></div><div class="line-subsection"><h3>내부선</h3><label class="art-row" for="art-innerWidth"><span>내부선 두께</span><input id="range-innerWidth" type="range" aria-label="내부선 두께 슬라이더" min="0" max="6" value="2" step=".1"><span class="number-field"><input id="art-innerWidth" type="number" aria-label="내부선 두께" min="0" max="6" value="2" step=".1" title="직접 입력 · 휠 또는 드래그로 조절"><span>px</span></span></label>
<label class="art-row" for="art-innerAngle"><span>내부선 각도</span><input id="range-innerAngle" type="range" aria-label="내부선 각도 슬라이더" min="1" max="90" value="21" step="any"><span class="number-field"><input id="art-innerAngle" type="number" aria-label="내부선 각도" min="1" max="90" value="21" step=".1"><span>°</span></span></label><label class="check-row"><input id="art-innerFace" type="checkbox" checked> 내부선에 면색 적용</label><label class="art-row" for="art-innerBrightness"><span>내부선 명도</span><input id="range-innerBrightness" type="range" aria-label="내부선 명도 슬라이더" min="0" max="200" value="90" step="1"><span class="number-field"><input id="art-innerBrightness" type="number" aria-label="내부선 명도" min="0" max="200" value="90" step="1" title="직접 입력 · 휠 또는 드래그로 조절"><span>%</span></span></label>
<label class="art-row" for="art-innerSaturation"><span>내부선 채도</span><input id="range-innerSaturation" type="range" aria-label="내부선 채도 슬라이더" min="0" max="200" value="150" step="1"><span class="number-field"><input id="art-innerSaturation" type="number" aria-label="내부선 채도" min="0" max="200" value="150" step="1" title="직접 입력 · 휠 또는 드래그로 조절"><span>%</span></span></label>
</div></details>
        <details class="art-panel" id="shadingPanel" open><summary>명암 <span>시간에 따른 자연광</span></summary>
          <div class="art-toolbar"><label class="check-row"><input id="art-shading" type="checkbox" checked> 명암 표시</label><button id="resetShading" class="small-reset" title="명암 설정 초기화" aria-label="명암 설정 초기화">↺</button></div>
          <select id="art-shadingMode" aria-label="명암 표현"><option value="smooth">그라데이션</option><option value="two">1도 명암</option><option value="three">2도 명암</option></select>
<label class="art-row" for="art-brightness"><span>빛 밝기</span><input id="range-brightness" type="range" aria-label="빛 밝기 슬라이더" min="0" max="200" value="100" step="1"><span class="number-field"><input id="art-brightness" type="number" aria-label="빛 밝기" min="0" max="200" value="100" step="1" title="직접 입력 · 휠 또는 드래그로 조절"><span>%</span></span></label>
<label class="art-row" for="art-density"><span>명암 농도</span><input id="range-density" type="range" aria-label="명암 농도 슬라이더" min="0" max="100" value="70" step="1"><span class="number-field"><input id="art-density" type="number" aria-label="명암 농도" min="0" max="100" value="70" step="1" title="직접 입력 · 휠 또는 드래그로 조절"><span>%</span></span></label>
<label class="check-row"><input id="art-shadows" type="checkbox" checked> 그림자 표시</label></details>
        <label class="setting-row aa-row" for="art-antialias">안티앨리어싱<select id="art-antialias"><option value="off">끔</option><option value="fxaa">표준 · FXAA</option><option value="msaa" selected>고품질 · 4× + FXAA</option></select></label>
      </section>

    </fieldset>
    <div id="sceneDiagnostics" hidden inert>        <label class="setting-row" for="shopView">동네 상가<select id="shopView" style="max-width:190px"><option value="">상가 위치 보기</option></select></label>
        <p id="shopStats" class="micro-hint">상가 연결 중…</p>
        <label class="check-row"><input id="billboardLighting" type="checkbox" checked> 사람·나무 주변 조명 반영</label>
        <label class="check-row"><input id="contactShadows" type="checkbox" checked> 발밑·나무 밑동의 부드러운 그림자</label>
<span id="detailStats"></span><span id="streetStats"></span><span id="yardStats"></span><span id="vegetationStats"></span><span id="peopleStats"></span><span id="billboardStats"></span><span id="timeModelNote"></span><span id="appearanceStats"></span><span id="locationDataNote"></span></div>
  </aside>
</div>
<dialog id="optimizationDialog" aria-labelledby="optimizationTitle">
  <div class="settings-panel">
    <div class="dialog-heading"><h2 id="optimizationTitle">렌더링 최적화</h2><button id="closeSettings" class="icon-button" aria-label="설정 닫기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div>
    <section>
      <h3>보이는 구역</h3>
      <label class="check-row"><input id="optimize" type="checkbox" checked> 보이는 구역만 그리기</label>
      <label class="check-row"><input id="occlusion" type="checkbox" checked> 건물에 완전히 가려진 곳 제외</label>
      <p class="hint">화면 밖과 건물 뒤의 오브젝트를 제외합니다. 그림자·충돌·저장할 모델은 유지됩니다.</p>
    </section>
    <section>
      <h3>화면 품질</h3>
      <label class="setting-row" for="pixelQuality">화면 해상도<select id="pixelQuality"><option value="1">가볍게 · 1×</option><option value="1.5">균형 · 최대 1.5×</option><option value="2" selected>선명하게 · 최대 2×</option></select></label>
      <label class="check-row"><input id="weatherMotion" type="checkbox" checked> 비·눈 움직임</label>
      <p class="hint">카메라가 멈추면 재그리기를 쉽니다. 비·눈이 움직일 때는 최대 초당 24회 갱신합니다. 움직임을 끄면 정지한 비·눈을 유지합니다.</p>
    </section>
    <section class="performance-readout" aria-label="현재 렌더링 상태">
      <h3>현재 화면</h3>
      <p id="lodStats" class="hint"></p><p id="perfStats" class="hint"></p><p id="cullStats" class="hint"></p><p id="renderState" class="hint">준비 중…</p>
      <div class="buttons"><button id="comparePerformance">현재 화면 성능 비교</button></div>
      <p id="benchmarkStats" class="hint" role="status"></p>
    </section>
  </div>
</dialog>
<script type="module" src="./app.js?v=exteriors1"></script>
</body>
</html>
