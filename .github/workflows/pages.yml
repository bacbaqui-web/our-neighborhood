name: Publish neighborhood
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image build dependency
        run: python -m pip install Pillow
      - name: Check loading behavior
        run: |
          node scripts/check-loading.mjs
          node tests/browser-generation.mjs
          node tests/vworld-browser.mjs
          node tests/visible-horizon.mjs
          node tests/visible-horizon-worker.mjs
          node --experimental-loader ./tests/three-loader.mjs tests/street-end-context.mjs
      - name: Check scene budget
        run: |
          node --experimental-loader ./tests/three-loader.mjs tests/scene-budget.mjs
          node --experimental-loader ./tests/three-loader.mjs tests/circular-background.mjs
          node --experimental-loader ./tests/three-loader.mjs tests/full-detail.mjs
          node --experimental-loader ./tests/three-loader.mjs tests/shop-interiors.mjs
          node --experimental-loader ./tests/three-loader.mjs tests/shop-expansion.mjs
          python3 -m unittest discover -s tests -p test_generation_scope.py
      - uses: actions/configure-pages@v5
      - name: Build reviewed public assets
        env:
          VWORLD_WEB_KEY: ${{ secrets.VWORLD_WEB_KEY }}
        run: python3 scripts/build-site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
